<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Should uploads wait for Wi-Fi?</title>
<style>
  :root { color-scheme: light; --ink: #1f2430; --muted: #5d6475; --line: #dde1e8; --accent: #3b5bdb; --soft: #f4f6fb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  main { max-width: 880px; margin: 0 auto; padding: 40px 28px 64px; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  h1 { margin: 6px 0 10px; font-size: 30px; line-height: 1.15; }
  h2 { margin: 36px 0 10px; font-size: 19px; }
  p.lead { margin: 0; color: var(--muted); font-size: 17px; }
  .card { padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--soft); }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) { h1 { font-size: 24px; } }
</style>
</head>
<body><main>
<div class="eyebrow">resonance · your call</div>
<h1>Should uploads wait for Wi-Fi?</h1>
<p class="lead">Snip uploads average 4 MB, and most happen right after listening, often on cellular.</p>
<h2>Recommended</h2>
<div class="card"><p>Wi-Fi only by default, with a switch in Settings for anyone who wants uploads everywhere.</p></div>
</main></body>
</html>
