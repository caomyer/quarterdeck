name: App

# The app's own checks. Work here lands by pushing a branch and fast-forwarding
# main, so these run on every branch, not only on main and not only where
# someone opened a pull request; a check run attaches to its commit, so a pull
# request over that branch shows the same result without a second run of the
# same work. They run on a change confined to engine/ as well: the app ships
# the engine and one of these tests lays out a home with the engine's own
# script, which is exactly the contract an engine change can break.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One group per branch, so a newer push to a branch replaces the run still going
# for the one it superseded. Pushes to main are never cancelled: each is a
# distinct state of the default branch and each deserves its own answer.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web
    # Both of this lane's jobs run on the captain's own Mac, registered as a
    # self-hosted runner. Two reasons, and the second is the stronger one.
    # GitHub meters hosted runners and bills macOS at ten times Linux, which
    # emptied a month of minutes in a day. And the app ships for macOS, so a
    # check that runs here is a check that ran where the product runs, under the
    # same stock Bash 3.2 the product gets. Self-hosted minutes are not metered
    # and do not count against the spending limit. The engine's behaviour lanes
    # are the exception and stay on Linux; engine.yml says why.
    runs-on: [self-hosted, macOS, ARM64]
    # Hang tripwire, not the expected wall: a healthy run is a few minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every workflow in the repository, on every branch. The Engine lane owns
      # the engine's lint but only runs on main and on a pull request to it, so
      # a malformed workflow on a branch would reach main before anything said
      # so. The engine's linter is the single owner of what that lint is.
      - name: Workflows
        run: |
          set -eu
          engine/bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin" >/dev/null
          PATH="$RUNNER_TEMP/bin:$PATH" engine/bin/fm-lint-workflows.sh
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test
      # The only step that runs the bundler; nothing else would catch a build
      # that type-checks and still fails to bundle.
      - name: Build
        run: pnpm build
      - name: Install the browser the page checks drive
        run: pnpm exec playwright install chromium
      - name: Page checks against the browser mock
        env:
          ARTIFACT_SHOTS: ${{ runner.temp }}/shots
        run: |
          set -eu
          pnpm dev --port 4191 --strictPort >"$RUNNER_TEMP/vite.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/vite.pid"
          attempt=0
          until curl -fsS http://127.0.0.1:4191 >/dev/null 2>&1; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 300 ] || {
              echo "::error::the dev server never came up"
              cat "$RUNNER_TEMP/vite.log" || true
              exit 1
            }
            sleep 0.2
          done
          # Each suite runs whatever the one before it did, so a red run reports
          # every page that is wrong, not only the first.
          failed=
          FIRSTMATE_URL=http://127.0.0.1:4191 pnpm projects || failed="$failed projects"
          FIRSTMATE_URL=http://127.0.0.1:4191 pnpm artifacts || failed="$failed artifacts"
          FIRSTMATE_URL=http://127.0.0.1:4191 pnpm tones || failed="$failed tones"
          FIRSTMATE_URL=http://127.0.0.1:4191 pnpm onboarding || failed="$failed onboarding"
          [ -z "$failed" ] || {
            echo "::error::page checks failed:$failed"
            exit 1
          }
      - name: What the dev server said
        if: failure()
        run: cat "$RUNNER_TEMP/vite.log" || true
      - name: Keep the pages the checks saw
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page-check-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - name: Stop the dev server
        if: always()
        run: |
          set -eu
          [ -f "$RUNNER_TEMP/vite.pid" ] || exit 0
          # By the pid this job started, never by a pattern that could match another process.
          kill "$(cat "$RUNNER_TEMP/vite.pid")" 2>/dev/null || true

  rust:
    name: Rust
    runs-on: [self-hosted, macOS, ARM64]
    # Hang tripwire: a cold toolchain install and build measure around ten
    # minutes, and the first run of all pays for a cold cargo cache.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      # GitHub's hosted macOS image shipped Rust preinstalled. The self-hosted
      # runner does not, and the PATH it hands a step is not the captain's
      # interactive PATH, so cargo is present on the machine and invisible to
      # the job: the first self-hosted run failed here with exit 127. This is
      # the same gap AGENTS.md already works around for `pnpm tauri dev`.
      # Named once, before the cache action, which shells out to cargo itself.
      - name: Rust toolchain on PATH
        run: |
          set -eu
          [ -x "$HOME/.cargo/bin/cargo" ] || {
            echo "::error::cargo is not at ~/.cargo/bin on this runner; install rustup there"
            exit 1
          }
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Otherwise a red run saves nothing and the next one builds cold again.
          cache-on-failure: true
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test
